name: taskflow
description: "TaskByte – a clean task manager for gig workers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  go_router: ^15.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1
  flutter_animate: ^4.5.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^6.2.2
  audioplayers: ^6.7.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - .env
